name: xnu

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: macOS release whose xnu to build (13.5 = xnu-8796, iOS 16 era)
        default: "13.5"
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      machine_config:
        description: xnu MACHINE_CONFIG
        default: SWEET
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "true"
  push:
    branches: [main]
    paths:
      - "xnu/patches/**"
      - ".github/workflows/xnu.yml"

concurrency:
  group: xnu-${{ github.ref }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: ${{ inputs.macos_version || '13.5' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: ${{ inputs.machine_config || 'SWEET' }}

jobs:
  build:
    # macos-14 still ships Xcode 15.x: its iig matches the xnu-8796 IORPC ABI
    # (Xcode 16's iig emits IORPC.kernelContent, which this xnu lacks)
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Fetch build script
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          # 12.5-14.3 use the top-level patches dir; ours go next to blacktop's
          cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/
          # libfirehose_kernel is built arm64e-only; the SWEET kernel is plain arm64
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
          grep -c 'VALID_ARCHS="x86_64 arm64e arm64"' dxb/build.sh
          ls dxb/patches

      - name: Deps
        run: |
          brew install jq gum bash cmake ninja
          # build.sh only checks that xcodes exists (Xcode is preinstalled); no bottle on macOS 14
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --find iig

      - name: Build
        working-directory: dxb
        env:
          # keep going after errors so one run reports every compile failure
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
        run: bash build.sh

      - name: Package build tree for local compiles
        if: always()
        run: |
          # Generated headers, config option headers, mig output and the patched
          # source: enough to re-run any single compile command from the log locally.
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p sdk-kernel-platform
          cp -R "$SDK/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform" sdk-kernel-platform/ || true
          tar czf buildtree.tgz \
            --exclude='*.o' --exclude='*.cpo' --exclude='*.a' --exclude='*.dSYM' --exclude='*.unstripped' \
            --exclude='kernel.development.*' --exclude='.git' \
            -C dxb build/xnu.obj fakeroot/usr/local/include xnu \
            -C .. sdk-kernel-platform
          ls -la buildtree.tgz

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-buildtree
          path: buildtree.tgz
          retention-days: 7

      - name: Inspect closed KDK support libs
        if: always()
        run: |
          mkdir -p out/kdk-libs
          for lib in /Library/Developer/KDKs/*/System/Library/KernelSupport/lib*.a; do
            b=$(basename "$lib" .a)
            ar t "$lib" > "out/kdk-libs/$b.members.txt" 2>&1 || true
            nm -m "$lib" > "out/kdk-libs/$b.nm.txt" 2>&1 || true
            lipo -info "$lib" >> out/kdk-libs/arch.txt 2>&1 || true
          done
          ls -la out/kdk-libs

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          ls -la out
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel
          path: out/
          if-no-files-found: warn

      # Build the boot shim for the OCEAN board (Redmi Note 2S / SDM710).
      # The shim is bare-metal ARM64 code; it needs a cross compiler and
      # mkbootimg, both of which the macOS runner can provide.
      - name: Build the OCEAN boot shim
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          # mkbootimg is not in Homebrew, so it is not needed here: the
          # boot image is assembled on the host with tools/mkbootimg or
          # by hand.  Only the bare-metal shim is built here.
          brew install aarch64-elf-gcc aarch64-elf-binutils || true

          cd shim
          mkdir -p out

          # Prefer the aarch64-linux-gnu cross compiler the shim's
          # build.sh expects; fall back to Homebrew's aarch64-elf-gcc.
          CC=""
          OBJCOPY=""
          for cand in aarch64-linux-gnu-gcc aarch64-none-elf-gcc aarch64-elf-gcc; do
            if command -v "$cand" >/dev/null 2>&1; then
              CC="$cand"
              OBJCOPY="$(echo "$cand" | sed 's/gcc$/objcopy/')"
              break
            fi
          done
          if [ -z "$CC" ]; then
            echo "::error::no aarch64 cross compiler found"
            exit 1
          fi
          "$CC" --version | head -1
          CFLAGS="-O2 -ffreestanding -nostdlib -fno-pic -mgeneral-regs-only -mstrict-align -fno-stack-protector -Wall -Wextra"
          ok=1
          for f in start.S shim.c console.c mmu.c fdt.c loader.c ufs.c emmc.c; do
            "$CC" $CFLAGS -c "$f" -o "out/${f%.*}.o" || ok=0
          done
          if [ "$ok" != 1 ]; then
            echo "::error::shim compile failed"
            exit 1
          fi
          "$CC" $CFLAGS -static -T shim.ld -Wl,--build-id=none -Wl,--no-warn-rwx-segments -Wl,-N \
            out/start.o out/shim.o out/console.o out/mmu.o out/fdt.o out/loader.o out/ufs.o out/emmc.o \
            -o out/shim.elf
          "$OBJCOPY" -O binary out/shim.elf out/Image
          size=$(nm out/shim.elf | awk '$3=="_end"{print strtonum("0x"$1)}')
          truncate -s "$size" out/Image
          ls -la out/Image


      - name: Package the OCEAN shim
        if: always()
        run: |
          mkdir -p out-ocean
          cp -R shim/out/. out-ocean/ 2>/dev/null || true
          # The ADT for the SDM710 board.
          python3 tools/mkadt_ocean.py out-ocean/ocean.adt --highmem
          ls -la out-ocean

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ocean-shim
          path: out-ocean/
          if-no-files-found: warn
